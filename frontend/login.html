<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log in — LinKey Shards</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <div class="panel left">
    <div class="pattern">
      <svg viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
        <g fill="none" stroke="#FFF5F5" stroke-width="1.2">
          <polygon points="80,40 140,75 140,145 80,180 20,145 20,75"/>
          <polygon points="200,40 260,75 260,145 200,180 140,145 140,75"/>
          <polygon points="80,180 140,215 140,285 80,320 20,285 20,215"/>
          <polygon points="200,180 260,215 260,285 200,320 140,285 140,215"/>
          <polygon points="320,40 380,75 380,145 320,180 260,145 260,75"/>
          <polygon points="320,180 380,215 380,285 320,320 260,285 260,215"/>
          <polygon points="80,320 140,355 140,425 80,460 20,425 20,355"/>
          <polygon points="200,320 260,355 260,425 200,460 140,425 140,355"/>
          <polygon points="320,320 380,355 380,425 320,460 260,425 260,355"/>
          <polygon points="440,40 500,75 500,145 440,180 380,145 380,75"/>
          <polygon points="440,180 500,215 500,285 440,320 380,285 380,215"/>
          <polygon points="440,320 500,355 500,425 440,460 380,425 380,355"/>
          <polygon points="560,40 620,75 620,145 560,180 500,145 500,75"/>
          <polygon points="560,180 620,215 620,285 560,320 500,285 500,215"/>
          <polygon points="80,460 140,495 140,565 80,600 20,565 20,495"/>
          <polygon points="200,460 260,495 260,565 200,600 140,565 140,495"/>
          <polygon points="320,460 380,495 380,565 320,600 260,565 260,495"/>
          <polygon points="440,460 500,495 500,565 440,600 380,565 380,495"/>
        </g>
      </svg>
    </div>

    <div class="left-content">
      <div class="eyebrow">Welcome back</div>
      <div class="tagline" style="font-size:2.2rem;">Log in</div>

      <form id="login-form" class="auth-form">
       <input id="login-email" name="email" type="email" placeholder="email" required>
<input id="login-password" name="password" type="password" placeholder="password" required>
        <button type="submit">log in</button>
      </form>
<p id="login-error" style="display:none; color:#F09595; font-size:0.85rem; margin-top:12px;"></p>
      <p class="switch-link">Don't have an account? <a href="signup.html" id="switch-link">Sign up</a></p>
    </div>

    <div class="divider-note"><a href="index.html" class="back-link">← back to home</a></div>
  </div>

  <div class="panel right">
    <div class="pattern">
      <svg viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
        <g fill="none" stroke="#FFF5F5" stroke-width="1">
          <line x1="60" y1="120" x2="180" y2="200"/>
          <line x1="180" y1="200" x2="120" y2="330"/>
          <line x1="180" y1="200" x2="340" y2="180"/>
          <line x1="340" y1="180" x2="420" y2="300"/>
          <line x1="120" y1="330" x2="280" y2="420"/>
          <line x1="280" y1="420" x2="420" y2="300"/>
          <line x1="280" y1="420" x2="220" y2="560"/>
          <line x1="220" y1="560" x2="380" y2="620"/>
          <line x1="420" y1="300" x2="520" y2="440"/>
          <line x1="520" y1="440" x2="380" y2="620"/>
          <line x1="60" y1="120" x2="40" y2="280"/>
          <line x1="40" y1="280" x2="120" y2="330"/>
        </g>
        <g fill="#FFF5F5">
          <circle cx="60" cy="120" r="4"/>
          <circle cx="180" cy="200" r="4"/>
          <circle cx="120" cy="330" r="4"/>
          <circle cx="340" cy="180" r="4"/>
          <circle cx="420" cy="300" r="4"/>
          <circle cx="280" cy="420" r="4"/>
          <circle cx="220" cy="560" r="4"/>
          <circle cx="380" cy="620" r="4"/>
          <circle cx="520" cy="440" r="4"/>
          <circle cx="40" cy="280" r="4"/>
        </g>
      </svg>
    </div>

    <div class="logo-slot">
      <svg width="150" height="82" viewBox="0 0 220 120">
        <polygon points="30,20 55,35 50,70 20,75 8,45" fill="none" stroke="#E24B4A" stroke-width="3" stroke-linejoin="round"/>
        <polygon points="30,20 55,35 50,70 20,75 8,45" fill="#E24B4A" opacity="0.15"/>
        <line x1="30" y1="20" x2="20" y2="75" stroke="#FFF5F5" stroke-width="1" opacity="0.4"/>
        <circle cx="30" cy="20" r="2.5" fill="#FFF5F5" opacity="0.85"/>
        <circle cx="20" cy="75" r="2.5" fill="#FFF5F5" opacity="0.85"/>
        <text x="66" y="50" font-family="Segoe UI, sans-serif" font-size="26" font-weight="800" fill="#FFF5F5">LinKey</text>
        <text x="66" y="76" font-family="Segoe UI, sans-serif" font-size="26" font-weight="800" fill="#E24B4A">Shards</text>
      </svg>
    </div>

    <div class="right-content">
      <div class="right-eyebrow">Pick up where you left off</div>
      <p class="pull-quote">Your shards are waiting to become a <span class="accent-word">badge</span>.</p>
      <p style="margin-top:16px;">Log back in to continue your courses, keep your streak, and pick up any quiz or lab exactly where you left it.</p>
    </div>

    <div class="right-footer">
      <span>Courses</span><span class="dot">●</span>
      <span>Labs</span><span class="dot">●</span>
      <span>Badges</span><span class="dot">●</span>
      <span>CV builder</span>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
